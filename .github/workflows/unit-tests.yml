# The vitest unit tests and the translation gate, on every push and pull
# request. No server and no browser.
#
#   npm test             every *.test.ts (vitest)
#   npm run i18n:check   every suite language has every English key, keeps
#                        every placeholder and adds nothing
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests + translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run i18n:check
